no_auto_install: true

pre-commit:
  jobs:
    - run: bun x ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      exclude:
        - ".agents/**/*"
      stage_fixed: true

pre-push:
  jobs:
    - run: bun run verify:quick
